name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, tsan, asan, ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: Read compiler version
        id: compiler
        run: echo "version=$(c++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      # Keeps compiled dependencies between runs. Checkout gives project sources
      # fresh timestamps, so they still rebuild every time.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.preset }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('**/CMakeLists.txt', 'CMakePresets.json') }}

      # The runner's default ASLR entropy makes TSan abort at startup with
      # "unexpected memory mapping".
      - name: Lower ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}
